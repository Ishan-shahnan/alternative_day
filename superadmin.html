<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin - Leave Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = '/api';

        function SuperAdminApp() {
            const [token, setToken] = useState(localStorage.getItem('sa_token') || null);
            const [users, setUsers] = useState([]);
            const [error, setError] = useState('');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [editingUser, setEditingUser] = useState(null);
            const [editForm, setEditForm] = useState({ username: '', password: '', role: '' });

            useEffect(() => {
                if (token) fetchUsers();
            }, [token]);

            const fetchUsers = async () => {
                try {
                    const res = await fetch(`${API_URL}/super/users`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setUsers(data);
                    } else {
                        handleLogout();
                    }
                } catch (err) {
                    setError('Failed to fetch data');
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    const res = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginForm)
                    });
                    const data = await res.json();
                    if (res.ok && data.role === 'superadmin') {
                        setToken(data.token);
                        localStorage.setItem('sa_token', data.token);
                    } else {
                        setError('Unauthorized access');
                    }
                } catch (err) {
                    setError('Login failed');
                }
            };

            const handleLogout = () => {
                setToken(null);
                localStorage.removeItem('sa_token');
            };

            const handleUpdate = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/super/users/${editingUser.id}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify(editForm)
                    });
                    if (res.ok) {
                        setEditingUser(null);
                        fetchUsers();
                    } else {
                        alert('Failed to update. Username might be taken.');
                    }
                } catch (err) {
                    alert('Error updating user');
                }
            };

            const handleDelete = async (id) => {
                if (!confirm("Are you sure you want to delete this user?")) return;
                try {
                    const res = await fetch(`${API_URL}/super/users/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) fetchUsers();
                } catch(err) {
                    alert('Delete failed');
                }
            };

            if (!token) {
                return (
                    <div className="flex h-screen items-center justify-center">
                        <form onSubmit={handleLogin} className="bg-slate-800 p-8 rounded-xl shadow-xl border border-slate-700 w-96">
                            <h2 className="text-xl font-bold mb-4 text-emerald-400">SuperAdmin Login</h2>
                            {error && <div className="text-red-400 text-sm mb-4">{error}</div>}
                            <input className="w-full bg-slate-900 border border-slate-700 p-2 rounded mb-4 focus:outline-none focus:border-emerald-500 text-white" 
                                type="text" placeholder="Username" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} required />
                            <input className="w-full bg-slate-900 border border-slate-700 p-2 rounded mb-6 focus:outline-none focus:border-emerald-500 text-white" 
                                type="password" placeholder="Password" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} required />
                            <button className="w-full bg-emerald-600 hover:bg-emerald-500 p-2 rounded text-white font-bold transition">Access System</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-6 mt-10">
                    <div className="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                        <h1 className="text-2xl font-bold text-emerald-400">SuperAdmin Console</h1>
                        <button onClick={handleLogout} className="text-slate-400 hover:text-white transition">Logout</button>
                    </div>

                    <div className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-xl">
                        <table className="w-full text-left">
                            <thead className="bg-slate-900 text-slate-400 text-sm">
                                <tr>
                                    <th className="p-4 border-b border-slate-700 font-medium">ID</th>
                                    <th className="p-4 border-b border-slate-700 font-medium">Username</th>
                                    <th className="p-4 border-b border-slate-700 font-medium">Role</th>
                                    <th className="p-4 border-b border-slate-700 font-medium">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {users.map(u => (
                                    <tr key={u.id} className="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                                        <td className="p-4 text-slate-400">{u.id}</td>
                                        <td className="p-4 font-semibold text-white">{u.username}</td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 text-xs rounded-full ${u.role==='superadmin'?'bg-emerald-900/50 text-emerald-400':u.role==='admin'?'bg-blue-900/50 text-blue-400':'bg-slate-700 text-slate-300'}`}>
                                                {u.role.toUpperCase()}
                                            </span>
                                        </td>
                                        <td className="p-4">
                                            <button onClick={() => { setEditingUser(u); setEditForm({ username: u.username, role: u.role, password: '' }); }} className="text-blue-400 hover:text-blue-300 mr-4 text-sm font-medium">Edit Config</button>
                                            {u.role !== 'superadmin' && <button onClick={() => handleDelete(u.id)} className="text-red-400 hover:text-red-300 text-sm font-medium">Wipe User</button>}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {editingUser && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleUpdate} className="bg-slate-800 p-6 rounded-xl shadow-2xl border border-slate-600 w-full max-w-sm">
                                <h2 className="text-xl font-bold mb-4">Edit Configuration ({editingUser.username})</h2>
                                <label className="block text-sm text-slate-400 mb-1">Username (Login ID)</label>
                                <input className="w-full bg-slate-900 border border-slate-600 p-2 rounded mb-4 focus:outline-none focus:border-emerald-500 text-white" value={editForm.username} onChange={e => setEditForm({...editForm, username: e.target.value})} required />
                                
                                <label className="block text-sm text-slate-400 mb-1">New Password (leave blank to keep current)</label>
                                <input className="w-full bg-slate-900 border border-slate-600 p-2 rounded mb-4 focus:outline-none focus:border-emerald-500 text-white" type="password" value={editForm.password} onChange={e => setEditForm({...editForm, password: e.target.value})} />
                                
                                <label className="block text-sm text-slate-400 mb-1">Account Role</label>
                                <select className="w-full bg-slate-900 border border-slate-600 p-2 rounded mb-6 focus:outline-none focus:border-emerald-500 text-white" value={editForm.role} onChange={e => setEditForm({...editForm, role: e.target.value})}>
                                    <option value="user">User</option>
                                    <option value="admin">Admin</option>
                                    {editingUser.role === 'superadmin' && <option value="superadmin">Superadmin</option>}
                                </select>

                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setEditingUser(null)} className="flex-1 bg-slate-700 hover:bg-slate-600 py-2 text-white font-medium rounded transition">Cancel</button>
                                    <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2 text-white font-medium rounded transition">Save Details</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SuperAdminApp />);
    </script>
</body>
</html>
